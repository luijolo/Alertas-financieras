name: Monitor Alertas DAM

on:
  schedule:
    # UTC-4 (Santo Domingo): Se ejecuta cada 5 min entre 8:00 AM y 7:00 PM L-V
    - cron: '*/5 12-23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2

      - name: Instalar dependencias
        run: |
          install.packages(c("httr", "readxl", "digest", "jsonlite"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Ejecutar Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: Rscript script.R

      - name: Guardar estado en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add estado_hashes.json
          git commit -m "Auto-update hash state" || exit 0
          git push
