name: Alertas financieras

on:
  workflow_dispatch:

concurrency:
  group: alertas-financieras-group
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-fondos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2

      - name: Instalar dependencias del sistema y R
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libcurl4-openssl-dev libssl-dev
          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest"))
          install.packages(c("httr", "rvest", "jsonlite", "stringr", "chromote"), type = "source")
        shell: Rscript {0}

      - name: Instalar Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Ejecutar Script de Fondos
        timeout-minutes: 25
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FOP_GR: ${{ vars.FOP_GR }}
          MULT_LIQ: ${{ vars.MULT_LIQ }}
          MULT_FLEX: ${{ vars.MULT_FLEX }}
          MULT_DOLAR: ${{ vars.MULT_DOLAR }}
        run: Rscript script.R

      - name: Guardar estado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f estado_hashes.json
          git diff --staged --quiet || git commit -m "Update fondos state"
          git pull --rebase origin main
          git push origin main
